name: cedwyn-cms-relay
# Drains the estate editor queue through the multi-repository engine. The Worker performs stale/guard checks.
# The cross-repository token is optional; if absent, GITHUB_TOKEN can write only to the platform repo.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: cedwyn-cms-relay
  cancel-in-progress: false
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Commit queued publishes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMS_CROSS_REPO_TOKEN: ${{ secrets.CMS_CROSS_REPO_TOKEN }}
          CMS_RELAY_KEY: ${{ secrets.CMS_RELAY_KEY }}
        run: node workers/cedwyn-cms/relay/relay.mjs drain --via token
