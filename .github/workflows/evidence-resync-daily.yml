name: evidence-resync-daily
# Daily: reads selected project-labelled Gmail (read-only), redacts and triages with NVIDIA, then writes review candidates
# only to the private operations repository. The public source repository, Actions logs and issue comments carry counts only.
# Requires OPS_REPO_TOKEN and the private operations repository. Gmail ingest additionally requires OAuth + NVIDIA secrets.
# Add-only review intake: never edits catalogue records, opens/merges app PRs, applies owner-approved or publishes app data.
on:
  schedule:
    - cron: '20 6 * * *'   # 06:20 UTC daily; Gmail is queried directly through a read-only OAuth grant
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Collect and print only; write nothing, comment nothing'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: evidence-resync   # shared with webapps-refresh-twice-weekly
  cancel-in-progress: false
jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE: '27'
    steps:
      - name: Bootstrap private data branch
        env:
          OPS_REPO: ${{ vars.OPS_REPO || 'unclehowell/bucklerfamily-ops-private' }}
          OPS_REPO_TOKEN: ${{ secrets.OPS_REPO_TOKEN }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/evidence-resync/bootstrap-data-branch.sh" -o bootstrap.sh
          bash bootstrap.sh data
      - name: Scripts from this commit (no full checkout of the public site)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/evidence-resync/resync.py" -o resync.py
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/evidence-resync/gmail_export.py" -o gmail_export.py
      - name: Read scoped Gmail and create privacy-filtered candidate summaries
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 gmail_export.py --out data/resync/gmail/export.json --seen data/resync/gmail/processed.json --dry-run
          else
            python3 gmail_export.py --out data/resync/gmail/export.json --seen data/resync/gmail/processed.json
          fi
      - name: Collect candidates
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESYNC_LLM_MODEL: ${{ vars.RESYNC_LLM_MODEL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python3 resync.py --data data --dry-run; else python3 resync.py --data data --comment-out comment.md; fi
      - name: Commit the review file to evidence-resync
        if: ${{ inputs.dry_run != true }}
        run: |
          cd data
          git config user.name "bucklerfamily-estate-evidence-resync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resync
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "resync: daily candidates $(date -u +%F) (bucklerfamily-estate#27) — Sion's Tab agent"
          for i in 1 2 3; do git pull -q --rebase origin evidence-resync && git push origin HEAD:evidence-resync && exit 0; sleep 5; done; exit 1
      - name: Comment on the tracking issue when something is new
        if: ${{ inputs.dry_run != true && hashFiles('comment.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;print(json.dumps({'body':open('comment.md').read()}))" > body.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE/comments" -d @body.json -o /dev/null
