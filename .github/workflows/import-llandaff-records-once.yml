name: One-time Llandaff Records PDF import
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  import-source:
    if: ${{ github.event.pull_request.head.ref == 'catalogue/llandaff-records-pdf' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Download and validate the original scan
        shell: bash
        run: |
          set -euo pipefail
          pdf="web/research/sources/llandaff-records-vol-ii-1908.pdf"
          meta="web/research/sources/llandaff-records-vol-ii-1908.source.json"
          mkdir -p "$(dirname "$pdf")"
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "BucklerFamilyEstateSourcePreservation/1.0" \
            "https://dn790000.ca.archive.org/0/items/llandaffrecords01diogoog/llandaffrecords01diogoog.pdf" \
            --output "$pdf" || curl --fail --location --retry 3 --retry-delay 2 \
            "https://archive.org/download/llandaffrecords01diogoog/llandaffrecords01diogoog.pdf" \
            --output "$pdf"
          test "$(head -c 5 "$pdf")" = "%PDF-"
          bytes="$(wc -c < "$pdf" | tr -d ' ')"
          test "$bytes" -ge 2500000
          test "$bytes" -le 6000000
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pages="$(pdfinfo "$pdf" | awk '$1 == "Pages:" {print $2}')"
          test "$pages" = "133"
          sha="$(sha256sum "$pdf" | awk '{print $1}')"
          PDF_BYTES="$bytes" PDF_PAGES="$pages" PDF_SHA256="$sha" python3 - <<'PY'
          import json, os
          record = {
            "title": "Llandaff Records",
            "printed_title": "Llandaff Records. Volume II. Acts of the Bishops of Llandaff. Book I.",
            "publication_year": 1908,
            "transcriber": "Joseph Alfred Bradney",
            "publisher": "Committee appointed under the authority of the Llandaff Diocesan Conference",
            "printer": "Wm. Lewis, Cardiff",
            "extent_pages": int(os.environ["PDF_PAGES"]),
            "digital_item": "llandaffrecords01diogoog",
            "internet_archive_identifier": "llandaffrecords01diogoog",
            "internet_archive_ark": "ark:/13960/t7wm3wj40",
            "source_pdf_url": "https://dn790000.ca.archive.org/0/items/llandaffrecords01diogoog/llandaffrecords01diogoog.pdf",
            "item_page": "https://archive.org/details/llandaffrecords01diogoog",
            "scan_attribution": "Google scan of a copy from the New York Public Library collection; uploaded to the Internet Archive on 10 April 2014.",
            "repository_copy": "/research/sources/llandaff-records-vol-ii-1908.pdf",
            "byte_length": int(os.environ["PDF_BYTES"]),
            "sha256": os.environ["PDF_SHA256"],
            "copyright_note": "Internet Archive item metadata identifies the US copyright region as NOT_IN_COPYRIGHT. This is not a determination of copyright status in every jurisdiction."
          }
          with open("web/research/sources/llandaff-records-vol-ii-1908.source.json", "w", encoding="utf-8") as f:
            json.dump(record, f, ensure_ascii=False, indent=2)
            f.write("\n")
          PY
          echo "Validated PDF: $bytes bytes; $pages pages; SHA-256 $sha"
          pdfinfo "$pdf" | sed -n '1,18p'
      - name: Remove the one-use importer and commit the unchanged source
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/import-llandaff-records-once.yml
          git rm -f .import/llandaff-records-pdf-import.marker
          git add web/research/sources/llandaff-records-vol-ii-1908.pdf web/research/sources/llandaff-records-vol-ii-1908.source.json
          git commit -m "Preserve original Llandaff Records volume II scan"
          git push origin "HEAD:${HEAD_REF}"
