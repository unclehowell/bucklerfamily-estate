name: restore-emails-index
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore index from known blob and append
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'PY'
          import json, urllib.request, base64, os
          token = os.environ["GH_TOKEN"]
          # Download good index from commit 3fa6b52
          url = "https://api.github.com/repos/unclehowell/bucklerfamily-estate/contents/data/core/records/emails/index.json?ref=3fa6b52c2dd79e163f84a66ceee122d38897f39b"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "cedwyn-restore",
          })
          with urllib.request.urlopen(req) as r:
              meta = json.loads(r.read())
          content = base64.b64decode(meta["content"]).decode()
          data = json.loads(content)
          with open("data/core/records/emails/index-append-24.json") as f:
              app = json.load(f)
          existing = {r[0] for r in data["records"]}
          for row in app["records"]:
              if row[0] not in existing:
                  data["records"].append(row)
          data["count"] = len(data["records"])
          data["parts"] = 24
          data["updated"] = "2026-11-14T12:00:00Z"
          with open("data/core/records/emails/index.json", "w") as f:
              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
          print("restored", data["count"], "last", data["records"][-1][0])
          PY
      - name: Commit
        run: |
          git config user.name "cedwyn-bot"
          git config user.email "cedwyn-bot@users.noreply.github.com"
          git add data/core/records/emails/index.json
          git diff --cached --quiet || git commit -m "catalogue: restore emails index.json 1143 records EV-2046–2050"
          git push
