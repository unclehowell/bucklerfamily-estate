name: Cancel superseded mirror attempts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-mirror-runs.yml

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Stop superseded duplicate mirror runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 43421441019; do
            status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq '.status')"
            if [ "${status}" = "in_progress" ] || [ "${status}" = "queued" ]; then
              gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/force-cancel"
              echo "Force-cancelled superseded run ${id}."
            else
              echo "Run ${id} is already ${status}; no action."
            fi
          done
